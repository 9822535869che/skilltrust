    const err = $('#aErr'); err.textContent = '';
    if (S.role !== 'admin') return toast('เฉพาะผู้ดูแลระบบมอบสิทธิ์ได้', 'err');
    if (!/^0x[0-9a-fA-F]{40}$/.test(w) && !/^0x[0-9a-fA-F]{4}\.\.\.[0-9a-fA-F]{4}$/.test(w)) { err.textContent = 'Wallet address ต้องขึ้นต้นด้วย 0x ตามด้วยเลขฐาน 16 เช่น 0x71a3...9f2e หรือแบบเต็ม 40 ตัว'; return; }
    const key = /^0x/.test(w) && w.length === 42 ? w.toLowerCase() : w;
    if (S.accounts.some(a => a.wallet === key)) { err.textContent = 'Wallet นี้มีสิทธิ์อยู่แล้ว'; return; }
    S.accounts.push({wallet:key, name:n, active:true, admin:false}); saveAccounts(); addLog('มอบสิทธิ์ให้ ' + n);
    if (/^0x[0-9a-fA-F]{40}$/.test(key)) chainLog('ISSUER_SET', {issuer: key, allowed: true});
    toast('มอบสิทธิ์แล้ว' + (S.contract.saved ? ' และบันทึกลงสัญญาที่ตั้งค่าไว้' : ' (ยังไม่ได้เชื่อมสัญญา)'), 'ok'); render();
  },
  grade: f => {
    if (!isAuthorizedIssuer()) return toast('บัญชีนี้ไม่มีสิทธิ์บันทึกผล', 'err');
    const en = S.enrollments.find(e => e.id === f.dataset.id);
    if (!en || en.status !== 'enrolled') return;
    const att = parseInt(f.elements.att.value, 10), score = parseInt(f.elements.score.value, 10);
    if (isNaN(att) || isNaN(score) || att < 0 || att > 100 || score < 0 || score > 100) return toast('กรอกค่าระหว่าง 0 ถึง 100', 'err');
    en.att = att; en.score = score; addLog(`บันทึกผลของ ${en.name} (${cname(en.course)})`);
    toast(passes(en) ? 'ผ่านเกณฑ์ พร้อมออกใบรับรอง' : 'บันทึกผลแล้ว ยังไม่ผ่านเกณฑ์', passes(en) ? 'ok' : 'err'); render();
  },
  issue: async f => {
    const err = $('#iErr'); err.textContent = '';
    if (!isAuthorizedIssuer() || !ATT.canEdit) return toast('เฉพาะผู้ออกใบรับรองที่ได้รับสิทธิ์เท่านั้น', 'err');
    if (!f.iEnr) { err.textContent = 'ยังไม่มีผู้เรียนที่ผ่านเกณฑ์ในหลักสูตรนี้'; return; }
    const en = sysEnrOf(f.iEnr.value);
    if (!en) { err.textContent = 'ไม่พบผู้เรียนในผลการเรียน'; return; }
    if (en.cert) { err.textContent = 'ผู้เรียนรายนี้ออกใบรับรองแล้ว รหัสอ้างอิง ' + en.cert.id; return; }
    const date = f.iDate.value;
    if (!date) { err.textContent = 'เลือกวันที่ออกใบรับรอง'; return; }
    if (date > todayISO()) { err.textContent = 'วันที่ออกห้ามเป็นวันในอนาคต'; return; }
    const id = nextId();
    const c = {id, name: en.name, course: en.course, date, wallet: en.wallet, issuer: walletOf(), status: 'valid', lrnUid: en.uid, issuedAt: Date.now()};
    const image = await renderCertPNG(c);
    const hash = await sha(dataUrlToBytes(image));
    if (chain.has(hash)) { err.textContent = 'ไฟล์นี้เคยถูกบันทึกแล้ว (Hash ซ้ำ)'; return; }
    c.image = image; c.fileHash = hash; chain.set(hash, id); S.certs.push(c); saveCertDb(c);
    addLog(`ออกใบรับรอง ${id} ให้ ${en.name}`);
    await publishCertToLearner(c);
    chainLog('ISSUE', {cert: id, uid: en.uid, course: en.course, date, fileHash: hash, issuer: walletOf()});
    toast('ออกใบรับรองและบันทึก Hash แล้ว', 'ok'); S.page = 'certs'; render();
  },
  contract: f => {
    const err = $('#ctErr'); err.textContent = '';
    if (S.role !== 'admin') return toast('เฉพาะผู้ดูแลระบบตั้งค่าสัญญาได้', 'err');
    const net = S.contract.network, rpc = '', addr = f.ctAddr.value.trim(), tx = f.ctTx.value.trim();
    if (!/^0x[0-9a-fA-F]{40}$/.test(addr)) { err.textContent = 'Contract address ต้องเป็น 0x ตามด้วยเลขฐาน 16 จำนวน 40 ตัว'; return; }
    if (rpc && !/^https:\/\/.+/.test(rpc)) { err.textContent = 'RPC URL ต้องขึ้นต้นด้วย https://'; return; }
    if (tx && !/^0x[0-9a-fA-F]{64}$/.test(tx)) { err.textContent = 'Transaction hash ต้องเป็น 0x ตามด้วยเลขฐาน 16 จำนวน 64 ตัว'; return; }
    S.contract = {network:net, rpc, address:addr, tx, saved:true};
    SKILLTRUST_CHAIN.setAddress(addr); chainPaint();
    try { localStorage.setItem('skilltrust_contract_v1', JSON.stringify({address: addr, tx})); } catch (e) { /* เบราว์เซอร์ไม่ให้เก็บ */ }
    chainCheckContract();
    addLog('ตั้งค่า Smart Contract บน ' + netLabel(net));
    toast('บันทึกการเชื่อมต่อสัญญาแล้ว', 'ok'); render();
  },
  qzCreate: async f => {
    if (!ATT.db) return toast('ยังไม่ได้เชื่อมฐานข้อมูล', 'err');
    const c = S.courses.find(x => x.code === f.qzCourse.value);
    if (!c) return toast('เลือกหลักสูตรที่ผู้ดูแลระบบสร้างไว้ก่อน', 'err');
    const title = f.qzTitle.value.trim();
    const questions = [], answers = [];
    for (let i = 0; i < 5; i++) {
      const q = f.querySelector('#qq' + i).value.trim();
      const choices = [0, 1, 2, 3].map(j => f.querySelector('#qc' + i + '_' + j).value.trim());
      const a = f.querySelector('input[name="qa' + i + '"]:checked');
      if (!q || choices.some(x => !x) || !a) return toast('กรอกคำถาม ตัวเลือก และเลือกคำตอบถูกให้ครบทุกข้อ', 'err');
      questions.push({q, choices}); answers.push(parseInt(a.value, 10));
    }
    const qid = 'qz' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    try {
      await ATT.db.doc('quizKeys/' + qid).set({answers});
      await ATT.db.doc('quizzes/' + qid).set({courseCode: c.code, course: c.name, title, questions, open: false, createdAt: Date.now(), createdBy: ATT.me});
      f.reset();
      toast('สร้างแบบทดสอบแล้ว', 'ok'); await qzRefresh();
    } catch (e) { toast('สร้างไม่สำเร็จ: ' + (e.message || e), 'err'); }
  },
  qzSubmit: async f => {
    const qid = f.dataset.id;
    const quiz = QZ.quizzes.find(q => q.id === qid);
    if (!quiz || !ATT.me) return toast('ไม่พบแบบทดสอบหรือยังไม่ได้เข้าสู่ระบบ', 'err');
    if (!ATT.enrolled[quiz.courseCode]) return toast('สมัครหลักสูตรนี้ก่อนทำแบบทดสอบ', 'err');
    if (!quizCanTake(quiz)) return toast(quizState(quiz) === 'passed' ? 'คุณผ่านแบบทดสอบนี้แล้ว' : 'รอผลการตรวจของครั้งก่อนก่อนทำซ้ำ', 'err');
    const answers = quiz.questions.map((_, i) => { const r = f.querySelector('input[name="q' + i + '"]:checked'); return r ? parseInt(r.value, 10) : -1; });
    if (answers.includes(-1)) return toast('ตอบให้ครบทุกข้อก่อนส่ง', 'err');
    try {
      const prev = QZ.mySubs[qid];
      const attempts = ((prev && prev.attempts) || (prev ? 1 : 0)) + 1;
      const history = [...((prev && prev.history) || []), ...(prev ? [{score: prev.score, submittedAt: prev.submittedAt}] : [])];
      await ATT.db.doc('quizSubs/' + ATT.me).set({...QZ.mySubs, [qid]: {answers, submittedAt: Date.now(), score: null, attempts, history}});
      QZ.active = null;
      chainLog('QUIZ_SUBMIT', {uid: ATT.me, quiz: qid, attempt: attempts});
      toast('ส่งคำตอบแล้ว', 'ok');
      await qzRefresh(); render();
    } catch (e) { toast('ส่งไม่สำเร็จ: ' + (e.message || e), 'err'); }
  },
  attCreate: async f => {
    if (!ATT.db) return toast('ยังไม่ได้เชื่อมฐานข้อมูล', 'err');
    const c = S.courses.find(x => x.code === f.attCourse.value);
    const title = f.attTitle.value.trim();
    const mins = Math.min(240, Math.max(1, parseInt(f.attMins.value, 10) || 30));
    if (!c) return toast('เลือกหลักสูตรที่ผู้ดูแลระบบสร้างไว้ก่อน', 'err');
    if (!title) return toast('กรอกชื่อคาบให้ครบ', 'err');
    try {
      await ATT.db.doc('sessions/' + attNewSid()).set({courseCode: c.code, course: c.name, title, openMin: mins, open: false, closeAt: 0, code: '', prevCode: '', createdAt: Date.now(), createdBy: ATT.me});
      f.reset(); f.attMins.value = 30;
      toast('สร้างคาบแล้ว', 'ok'); await attRefresh();
    } catch (e) { toast('สร้างคาบไม่สำเร็จ: ' + (e.message || e), 'err'); }
  },
  learnerName: async f => {
    const err = document.getElementById('lnErr');
    const name = f.lnName.value.trim().replace(/\s+/g, ' ');
    if (name.length < 2) { if (err) err.textContent = 'กรอกชื่อให้ครบอย่างน้อย 2 ตัวอักษร'; return; }
    if (!ATT.me) return toast('ยังไม่ได้เข้าสู่ระบบบัญชี จึงบันทึกชื่อไม่ได้', 'err');
    if (!ATT.db) return toast('ยังไม่ได้เชื่อมฐานข้อมูล จึงบันทึกชื่อไม่ได้', 'err');
    try {
      const cur = docDataOf(await withTimeout(ATT.db.doc('learners/' + ATT.me).get(), 8000, 'อ่านข้อมูลนานเกินไป').catch(() => null)) || {};
      await withTimeout(ATT.db.doc('learners/' + ATT.me).set({...cur, name}), 8000, 'บันทึกชื่อนานเกินไป');
      ATT.myName = name; saveNameLocal(name); ATT.learnerNames[ATT.me] = name;
      toast('บันทึกชื่อแล้ว', 'ok'); render();
    } catch (e) { toast('บันทึกชื่อไม่สำเร็จ: ' + (e.message || e), 'err'); }
  },
  attCheck: async f => {
    const code = f.ckCode.value.trim();
    if (!ATT.db || !ATT.me) return attMsg('ยังไม่ได้เข้าสู่ระบบหรือยังไม่ได้เชื่อมฐานข้อมูล', 'err');
    if (!/^\d{6}$/.test(code)) return attMsg('รหัสต้องเป็นตัวเลข 6 หลัก', 'err');
    try {
      let target = null;
      for (const s of ATT.sessions.filter(x => x.open && ATT.enrolled[x.courseCode])) {
        const fresh = (await ATT.db.doc('sessions/' + s.id).get()).data();
        if (fresh && fresh.open && Date.now() <= fresh.closeAt && (fresh.code === code || fresh.prevCode === code)) { target = s.id; break; }
      }
      if (!target) return attMsg('รหัสไม่ถูกต้อง หรือคาบนี้ปิดเช็กชื่อแล้ว', 'err');
      const sn = await ATT.db.doc('checkins/' + ATT.me).get().catch(() => null);
      const att = {...loadAttLocal(), ...ATT.myAtt, ...((docDataOf(sn) || {}).attended || {})};
      if (att[target]) return attMsg('คุณเช็กชื่อคาบนี้ไปแล้ว', 'err');
      att[target] = Date.now();
      await ATT.db.doc('checkins/' + ATT.me).set({attended: att});
      ATT.myAtt = {...ATT.myAtt, ...att};
      saveAttLocal();
      attPaint();
      chainLog('CHECKIN', {uid: ATT.me, session: target, course: (ATT.sessions.find(s => s.id === target) || {}).courseCode || ''});
      f.ckCode.value = '';
      attMsg('เช็กชื่อสำเร็จ เวลา ' + attFmt(att[target]), 'ok');
      await attRefresh();
    } catch (e) {
      attMsg('เช็กชื่อไม่สำเร็จ อาจยังไม่มีสิทธิ์เขียน (' + (e.message || e) + ')', 'err');
    }
  },
  editCourse: f => {
    const err = $('#ecErr'); err.textContent = '';
    if (S.role !== 'admin') return toast('เฉพาะผู้ดูแลระบบแก้ไขหลักสูตรได้', 'err');
    const c = courseOf(f.dataset.code);
    if (!c.code) return;
    const name = f.ecName.value.trim(), start = f.ecStart.value, hours = parseInt(f.ecHours.value, 10);
    const att = parseInt(f.ecAtt.value, 10), score = parseInt(f.ecScore.value, 10);
    if (!name || !start) { err.textContent = 'กรอกชื่อหลักสูตรและวันที่เริ่มให้ครบ'; return; }
    if (!(hours >= 1)) { err.textContent = 'จำนวนชั่วโมงต้องมากกว่า 0'; return; }
    if (isNaN(att) || att < 0 || att > 100 || isNaN(score) || score < 0 || score > 100) { err.textContent = 'เกณฑ์ต้องอยู่ระหว่าง 0 ถึง 100'; return; }
    Object.assign(c, {name, start, hours, minAtt: att, passScore: score}); saveCourseDb(c);
    addLog('แก้ไขหลักสูตร ' + name);
    S.courseEdit = null;
    toast('บันทึกการแก้ไขแล้ว', 'ok'); render();
  },
  verifyId: f => { S.vId = f.vId.value; S.vResult = verifyById(S.vId); render(); },
  verifyFile: async f => {
    if (!S.vFile) return toast('กรุณาเลือกไฟล์ PDF ก่อน', 'err');
    const hash = await sha(await S.vFile.arrayBuffer());
    S.vResult = verifyByHash(hash, f.vId2 ? f.vId2.value : '');
    render();
  }
};

/* ---------- การเชื่อมต่อเหตุการณ์ (event delegation) ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (fn) {
    e.preventDefault(); fn(el.dataset.arg);
    if (CHAIN_ACT_KIND[el.dataset.act]) chainLog(CHAIN_ACT_KIND[el.dataset.act], {arg: el.dataset.arg || '', role: S.role, uid: ATT.me || walletOf() || ''});
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.closest('[data-act="scanQR"]')) ACT.scanQR();
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  const h = FORM[f.dataset.form];
  if (h) {
    h(f);
    if (CHAIN_FORM_KIND[f.dataset.form]) chainLog(CHAIN_FORM_KIND[f.dataset.form], {role: S.role, uid: ATT.me || walletOf() || ''});
  }
});
function livePreview() {
  const f = document.querySelector('form[data-live="issue"]');
  if (!f || !f.iEnr) return;
  const en = sysEnrOf(f.iEnr.value);
  if (!en) return;
  $('#livePreview').innerHTML = visualCert({id: en.cert ? en.cert.id : nextId(), name: en.name, course: en.course, date: f.iDate.value, wallet: en.wallet});
  issuePaint();
}
document.addEventListener('input', e => {
  if (e.target.dataset.input === 'vId') S.vId = e.target.value;
  if (e.target.closest('form[data-live="issue"]')) livePreview();
});
document.addEventListener('change', e => {
  if (e.target.id === 'qrSel') { S.vId = e.target.value; render(); return; }
  if (e.target.id === 'iCourseSel') { S.issueCourse = e.target.value; render(); return; }
  if (e.target.closest('form[data-live="issue"]')) livePreview();
  const k = e.target.dataset.file;
  if (!k) return;
  const file = e.target.files && e.target.files[0];
  if (k === 'issue') { S.issueFile = file || null; render(); }
  if (k === 'verify') { S.vFile = file || null; S.vFileName = file ? file.name : ''; render(); }
});

/* ---------- หน้าตรวจสอบสาธารณะ (เปิดจาก QR) ---------- */
const pubVerifyId = () => { const m = /(?:^#|&)verify=([^&]+)/.exec(location.hash || ''); try { return m ? decodeURIComponent(m[1]).trim() : ''; } catch (e) { return ''; } };
async function publicVerifyPage(id) {
  document.querySelector('.shell').style.display = 'none';
  document.querySelectorAll('.toast, #toast').forEach(x => { x.style.zIndex = 99; });
  const box = document.createElement('main');
  box.id = 'pubv'; box.style.cssText = 'max-width:640px;margin:0 auto;padding:28px 16px';
  document.body.appendChild(box);
  const head = `<div style="display:flex;align-items:center;gap:10px;margin-bottom:18px"><div style="font-weight:700;font-size:20px;color:var(--navy)">SkillTrust Academy</div><span class="tag info">ตรวจสอบใบรับรอง</span></div>`;
  box.innerHTML = head + `<div class="card"><h3>กำลังตรวจสอบ ${esc(id)}</h3><p class="sub" style="margin:0">กำลังอ่านข้อมูลจากบล็อกเชน Sepolia…</p></div>`;
  try {
    const r = await SKILLTRUST_CHAIN.readCertificate(id);
    const ex = (path, v) => `<a href="https://sepolia.etherscan.io/${path}/${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a>`;
    const dl = `<dl><div><dt>รหัสใบรับรอง</dt><dd>${esc(id)}</dd></div>
      <div><dt>หลักสูตร</dt><dd>${esc(r.courseName ? r.courseName + ' (' + r.courseCode + ')' : r.courseCode)}</dd></div>
      <div><dt>Wallet ผู้รับ</dt><dd style="word-break:break-all">${ex('address', r.recipient)}</dd></div>
      <div><dt>ผู้ออกใบรับรอง</dt><dd style="word-break:break-all">${ex('address', r.issuer)}</dd></div>
      <div><dt>วันที่ออก</dt><dd>${new Date(r.issuedAt * 1000).toLocaleDateString('th-TH', {day: 'numeric', month: 'long', year: 'numeric'})}</dd></div>
      <div><dt>Hash ไฟล์ที่บันทึกบน chain</dt><dd style="word-break:break-all">${esc(r.fileHash)}</dd></div>
      <div><dt>Contract</dt><dd style="word-break:break-all">${ex('address', r.contract)}</dd></div></dl>`;
    const note = `<p class="sub" style="font-size:12.5px;margin-top:14px">ข้อมูลนี้อ่านตรงจากสัญญาบน Sepolia ไม่ผ่านเซิร์ฟเวอร์ของเว็บนี้ บล็อกเชนเก็บเฉพาะ Hash ของไฟล์ ถ้าต้องการตรวจว่าไฟล์ใบรับรองที่ถืออยู่ไม่ถูกแก้ไข ให้นำ Hash ของไฟล์นั้นมาเทียบกับค่าด้านบน</p>`;
    if (r.status === 1) box.innerHTML = head + resBox('ok', 'check', 'Valid · ใบรับรองถูกต้อง ยังมีผลใช้งาน', dl) + note;
    else if (r.status === 2) box.innerHTML = head + resBox('bad', 'x', 'Revoked · ใบรับรองถูกเพิกถอนแล้ว', dl) + note;
    else box.innerHTML = head + resBox('bad', 'x', 'ไม่พบใบรับรองรหัสนี้บนบล็อกเชน', `<p>รหัส ${esc(id)} ไม่มีบันทึกในสัญญา ${esc(r.contract)} ใบรับรองอาจเป็นของปลอม รหัสผิด หรือยังไม่ได้ส่งขึ้น chain</p>`) + note;
  } catch (e) {
    box.innerHTML = head + resBox('warn', 'alert', 'ตรวจสอบไม่สำเร็จ', `<p>${esc(e.shortMessage || e.message || String(e))}</p><p>นี่ไม่ได้แปลว่าใบรับรองปลอม เป็นเพียงอ่านข้อมูลจากบล็อกเชนไม่ได้ในตอนนี้ ลองสแกนใหม่อีกครั้ง</p>`);
  }
}

/* ---------- เริ่มต้น ---------- */
if (pubVerifyId()) {
  publicVerifyPage(pubVerifyId());
} else {
  chainLoadQueue();
  loadAccounts();
  render();
  chainBoot();
}
</script>
</body>
</html>
